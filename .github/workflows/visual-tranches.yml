name: Historical visual tranches
on:
  push:
    branches: [main]
    paths:
      - 'Day1/**'
      - 'Day2/**'
      - 'Day3/**'
      - 'Day4/**'
      - 'Day5/**'
      - 'Day6/**'
      - 'Day7/**'
      - 'Day8/**'
      - 'Day9/**'
      - 'Day10/**'
      - 'Day11/**'
      - 'Day12/**'
      - 'Day13/**'
      - 'Day14/**'
      - 'Day15/**'
      - 'Day16/**'
      - 'scripts/render.py'
      - 'scripts/verify-walkthroughs.cjs'
      - 'tests/browser/historical-visuals.spec.cjs'
      - '.github/workflows/visual-tranches.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-visuals-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tranche:
    name: Days ${{ matrix.days }} desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        days: ['1-5', '6-10', '11-16']
    env:
      STUDY_VISUAL_DAYS: ${{ matrix.days }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 2
      - name: Replay, quiz and local link regression
        run: node scripts/verify-walkthroughs.cjs
        timeout-minutes: 1
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 4
      - name: Check every revised lesson in the tranche
        run: npx playwright test historical-visuals.spec.cjs
        timeout-minutes: 6
      - name: Preserve synthetic visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-tranche-${{ matrix.days }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

